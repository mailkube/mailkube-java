name: CI

on:
  push:
    # `develop` only, and `main` is absent on purpose. `develop` is the integration branch and is
    # pushed to directly, so without this trigger a direct push would run nothing — `pull_request`
    # alone does not cover it. `main` is covered instead by release.yml, which runs this whole
    # workflow through `workflow_call` as its `ci-gate` job before releasing. Adding `main` here
    # would put that gate run and a standalone push run in the same `ci-${{ github.ref }}`
    # concurrency group, where one is cancelled — and the cancelled one is what the README's CI
    # badge reports.
    branches: [develop]
  pull_request:
  workflow_call: # so release.yml can gate on the full CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is the only supported version. Java class files cannot load on an earlier JVM,
        # so "also test 21" is not a thing this library can offer.
        java-version: ["25"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Format check (spotless — palantir-java-format)
        run: ./gradlew spotlessCheck

      - name: Build, lint, test and gate coverage
        # `check` runs pmdMain, pmdTest, test and jacocoTestCoverageVerification.
        run: ./gradlew check

      - name: Javadoc
        run: ./gradlew javadoc

      - name: Publish readiness (publishToMavenLocal + the metadata Maven Central requires)
        # The release publishes from semantic-release's `publishCmd`, i.e. after the tag has been
        # pushed. A failure there leaves the tag on a commit with no artifact, and re-running finds
        # nothing left to release, so the check belongs on every PR instead.
        # `validatePublication` depends on `publishToMavenLocal`, so this runs the whole publication
        # against the local repository — no credentials, nothing uploaded — and then asserts the POM
        # elements Central validates and the local repository does not. See .rules/CI_GATES.md.
        run: ./gradlew validatePublication -Pversion=0.0.0-ci

      - name: Promote-step readiness (the half of the release no local build can exercise)
        # `publishCmd` runs the Gradle upload AND the staging-repository promote. The promote needs
        # live credentials and a real upload, so it cannot be rehearsed here — but its three
        # non-credential failure modes can, and each of them is silent until after the tag exists.
        run: |
          test -x scripts/promote-central.sh
          bash -n scripts/promote-central.sh
          # A rename that updates one file and not the other leaves `publishCmd` calling a script
          # that is not there, which strands a tagged version in an unpublished staging repository.
          grep -q 'promote-central.sh' .releaserc.json

  # There is deliberately no dependency-floor job: this library has NO runtime dependencies,
  # so there are no declared lower bounds to resolve down to. That is a property worth
  # keeping — add the job the day an `implementation` line appears. See .rules/CI_GATES.md.

  examples:
    # `examples/` is runnable documentation, and customers copy it. It is not a Gradle source set
    # — deliberately, so it never reaches the jar or the coverage denominator — which also means
    # `./gradlew check` never compiles it. javac does, here, against the jar a consumer would get,
    # so an API change cannot silently rot the docs. `pmdExamples` (wired into `check`) covers
    # complexity and dead code; spotless covers whitespace. Nothing in CI RUNS an example: that
    # would need live credentials.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4

      - name: Compile the examples (javac, against the built jar)
        # The same script the pre-commit hook runs, so local and CI cannot drift. It pins the jar
        # name rather than globbing it (`build/libs/mailkube-java-*.jar` also matches the sources
        # and javadoc jars once a publish task has run, and javac would read those as inputs),
        # asserts the file count, and needs no `--enable-preview` — JEP 512 compact source files
        # are final in Java 25.
        run: ./scripts/compile-examples.sh

      - name: PMD parsed every example
        # `pmdExamples` runs inside `check`, but the Gradle Pmd task EXITS 0 while printing a
        # ParseException or MalformedSourceException — it skips the file it cannot read and
        # reports no violations, so the gate silently switches off for exactly the files most
        # likely to be broken. Verified: a stray unicode escape in a comment produced
        # "MalformedSourceException" and BUILD SUCCESSFUL. This step is what makes that fail.
        run: |
          ./gradlew pmdExamples --rerun-tasks 2>&1 | tee pmd-examples.log
          if grep -qE 'ParseException|MalformedSourceException|Cannot load ruleset|No files to analyze' pmd-examples.log; then
            echo "pmdExamples did not actually analyze the examples — see above"
            exit 1
          fi

  dry:
    # Language-agnostic duplication (DRY) gate — identical across every mailkube repo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Copy-paste detection (jscpd)
        run: npx --yes jscpd@4 --config .jscpd.json .
      # Examples are excluded from the run above and measured here instead, at a higher
      # minTokens. Every example repeats the same scaffolding — import, read MAILKUBE_FROM,
      # build the client, catch ApiException — and deduping that into a shared helper would defeat
      # the point of a file you can read top to bottom and paste into your own project. 100 tokens
      # is past that boilerplate (the cliff is at 90) while still catching a copy-pasted example.
      - name: Copy-paste detection across examples (jscpd)
        run: npx --yes jscpd@4 --config .jscpd.examples.json examples/

  docs:
    # Governance gate: every .rules/*.md must be indexed in AGENTS.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rule-index sync check
        run: ./scripts/check-rule-index.sh
